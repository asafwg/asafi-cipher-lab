 music:{label:'Music',color:'#ff5da2'},euro:{label:'Eurovision',color:'#ffcf4a'},blender:{label:'Blender & 3D',color:'#ff8a2b'},tech:{label:'Technology',color:'#66a8ff'},future:{label:'Plans & learning',color:'#64dbac'},creative:{label:'Creative making',color:'#be8cff'},cipher:{label:'Coding & crypto',color:'#ffffff'}

const facts=[{"id":"f0","cat":"music","text":"Songwriting starts from lyrics, ideas and emotional phrasing.","parent":"music"},{"id":"f1","cat":"music","text":"Five professionally produced songs have been made in Hebrew.","parent":"music"},{"id":"f2","cat":"music","text":"Music is treated as a long-term craft, not just a side hobby.","parent":"music"},{"id":"f3","cat":"music","text":"Spotify and Apple Music are part of the release plan.","parent":"music"},{"id":"f4","cat":"music","text":"Production decisions matter as much as the initial songwriting.","parent":"music"},{"id":"f5","cat":"music","text":"Performance ideas often influence the writing itself.","parent":"music"},{"id":"f6","cat":"music","text":"A song can trigger a whole visual concept, not just an audio track.","parent":"music"},{"id":"f7","cat":"music","text":"Stage movement and camera language are considered alongside music.","parent":"music"},{"id":"f8","cat":"music","text":"Eurovision is a major source of songwriting and production inspiration.","parent":"music"},{"id":"f9","cat":"music","text":"The goal is to turn rough ideas into finished, release-ready work.","parent":"music"},{"id":"f10","cat":"euro","text":"Eurovision is studied through songs, staging, graphics and production.","parent":"euro"},{"id":"f11","cat":"euro","text":"Stage design is interesting as much as the songs themselves.","parent":"euro"},{"id":"f12","cat":"euro","text":"2025 Basel visuals use a highly recognizable heart-based identity.","parent":"euro"},{"id":"f13","cat":"euro","text":"Florian Wieder's stage design is a recurring visual reference point.","parent":"euro"},{"id":"f14","cat":"euro","text":"Eurovision archives are used as a source of ideas and comparisons.","parent":"euro"},{"id":"f15","cat":"euro","text":"The 'Hall of Fame' concept turns Eurovision history into a physical experience.","parent":"euro"},{"id":"f16","cat":"euro","text":"Visual identity, typography and stage architecture are all connected.","parent":"euro"},{"id":"f17","cat":"euro","text":"Postcard and backstage camera ideas are treated like miniature films.","parent":"euro"},{"id":"f18","cat":"euro","text":"Audience POVs, performer POVs and production POVs all matter.","parent":"euro"},{"id":"f19","cat":"euro","text":"Greenroom spaces can become part of the storytelling.","parent":"euro"},{"id":"f20","cat":"euro","text":"A good Eurovision concept should work as both a still image and a moving shot.","parent":"euro"},{"id":"f21","cat":"euro","text":"Stage visuals are designed around the song instead of being decoration.","parent":"euro"},{"id":"f22","cat":"blender","text":"Current Blender work uses Blender 5.x.","parent":"blender"},{"id":"f23","cat":"blender","text":"Eevee Next is the main render engine.","parent":"blender"},{"id":"f24","cat":"blender","text":"Materials are built with node-based workflows.","parent":"blender"},{"id":"f25","cat":"blender","text":"Volumetrics are used for atmospheric beams and depth.","parent":"blender"},{"id":"f26","cat":"blender","text":"Lighting needs to feel cinematic rather than like random bright bulbs.","parent":"blender"},{"id":"f27","cat":"blender","text":"Spotlights have been tuned specifically to avoid the 'Christmas lights' look.","parent":"blender"},{"id":"f28","cat":"blender","text":"Geometry Nodes are part of the procedural toolkit.","parent":"blender"},{"id":"f29","cat":"blender","text":"Camera animation is scripted instead of being entirely manual.","parent":"blender"},{"id":"f30","cat":"blender","text":"Precise frame ranges are used to control reveals and transitions.","parent":"blender"},{"id":"f31","cat":"blender","text":"Heavy Blender scenes can reach very large project-file sizes.","parent":"blender"},{"id":"f32","cat":"blender","text":"A stage replica is being built from reference images and measurements.","parent":"blender"},{"id":"f33","cat":"stage","text":"The main stage object has been measured at roughly 32 m by 60 m by 2 m.","parent":"stage"},{"id":"f34","cat":"stage","text":"A fractured cone concept uses a 6 m bottom radius.","parent":"stage"},{"id":"f35","cat":"stage","text":"The same cone concept expands to a 12 m top radius.","parent":"stage"},{"id":"f36","cat":"stage","text":"The cone spans 18 m vertically from stage level to its top.","parent":"stage"},{"id":"f37","cat":"stage","text":"The cone concept uses 1 m thickness.","parent":"stage"},{"id":"f38","cat":"stage","text":"The fractured look aims for 100+ separate pieces.","parent":"stage"},{"id":"f39","cat":"stage","text":"A circular stage section has a radius around 5.887 m.","parent":"stage"},{"id":"f40","cat":"stage","text":"Catwalks are designed around roughly 14.584 m length.","parent":"stage"},{"id":"f41","cat":"stage","text":"Those catwalks are roughly 3.6 m wide.","parent":"stage"},{"id":"f42","cat":"stage","text":"LED walls are treated as pixel-like grids with discrete color behavior.","parent":"stage"},{"id":"f43","cat":"stage","text":"Fog is part of the stage language, not just a rendering trick.","parent":"stage"},{"id":"f44","cat":"stage","text":"Light beams are choreographed as visible shapes in space.","parent":"stage"},{"id":"f45","cat":"stage","text":"Props are designed to work with camera movement and performer blocking.","parent":"stage"},{"id":"f46","cat":"stage","text":"The camera should sometimes reveal the stage from behind-the-scenes spaces.","parent":"stage"},{"id":"f47","cat":"stage","text":"A greenroom opening can be used as a transition into the performance world.","parent":"stage"},{"id":"f48","cat":"stage","text":"Backstage corridors and stairs can become cinematic camera routes.","parent":"stage"},{"id":"f49","cat":"stage","text":"The goal is to make the virtual stage feel physically navigable.","parent":"stage"},{"id":"f50","cat":"dancer","text":"A slim low-poly dancer is being built as a reusable character.","parent":"dancer"},{"id":"f51","cat":"dancer","text":"The outfit uses a neon-turquoise electric-worker-inspired shirt.","parent":"dancer"},{"id":"f52","cat":"dancer","text":"A net layer is visible through the shirt's V-neck.","parent":"dancer"},{"id":"f53","cat":"dancer","text":"Black baggy leather-style trousers complete the silhouette.","parent":"dancer"},{"id":"f54","cat":"dancer","text":"The shirt is meant to read as silky rather than metallic.","parent":"dancer"},{"id":"f55","cat":"dancer","text":"The character rig favors simple FK bones over an overcomplicated rig.","parent":"dancer"},{"id":"f56","cat":"dancer","text":"No weight painting is needed for the rigid character construction.","parent":"dancer"},{"id":"f57","cat":"dancer","text":"Hands and palms can be merged when separate bones add no useful control.","parent":"dancer"},{"id":"f58","cat":"dancer","text":"Control empties are preferred over constantly entering Pose Mode.","parent":"dancer"},{"id":"f59","cat":"dancer","text":"Rigid bone parenting keeps the early animation system predictable.","parent":"dancer"},{"id":"f60","cat":"dancer","text":"Feet are treated as part of the shin chain in the simplified rig.","parent":"dancer"},{"id":"f61","cat":"dancer","text":"A LEG_BEND control drives the crouched leg pose.","parent":"dancer"},{"id":"f62","cat":"dancer","text":"The dancer needs to climb stairs with alternating lead legs.","parent":"dancer"},{"id":"f63","cat":"dancer","text":"Animation scripts should only modify the requested frame range.","parent":"dancer"},{"id":"f64","cat":"dancer","text":"Character names are used to keep rigs and animation scripts aligned.","parent":"dancer"},{"id":"f65","cat":"tech","text":"The current phone setup includes a Nothing Phone 3.","parent":"tech"},{"id":"f66","cat":"tech","text":"The phone configuration being used is 256 GB.","parent":"tech"},{"id":"f67","cat":"tech","text":"Nothing OS / Pixel-like UI design is especially appealing.","parent":"tech"},{"id":"f68","cat":"tech","text":"Mac hardware is used for 3D, music and development work.","parent":"tech"},{"id":"f69","cat":"tech","text":"The main Mac is a MacBook Air with an M4 chip and 16 GB RAM.","parent":"tech"},{"id":"f70","cat":"tech","text":"A Galaxy Tab S6 Lite is used in the school workflow.","parent":"tech"},{"id":"f71","cat":"tech","text":"VR is useful for turning a room into a navigable digital space.","parent":"tech"},{"id":"f72","cat":"tech","text":"Meta Quest 3 is part of the VR toolkit.","parent":"tech"},{"id":"f73","cat":"tech","text":"Different devices are evaluated by how well they fit the workflow.","parent":"tech"},{"id":"f74","cat":"tech","text":"Operating-system design is a real part of the hardware preference.","parent":"tech"},{"id":"f75","cat":"vr","text":"Room scanning is a way to bring physical spaces into digital projects.","parent":"vr"},{"id":"f76","cat":"vr","text":"The idea is to turn real rooms into spatial interfaces.","parent":"vr"},{"id":"f77","cat":"vr","text":"VR can connect architecture, stage design and interactive exploration.","parent":"vr"},{"id":"f78","cat":"vr","text":"Spatial projects benefit from the same precision used in Blender scenes.","parent":"vr"},{"id":"f79","cat":"creative","text":"Knitting is one of the hands-on creative hobbies.","parent":"creative"},{"id":"f80","cat":"creative","text":"Cooking is another way to experiment with making things from scratch.","parent":"creative"},{"id":"f81","cat":"creative","text":"A 3D pen is useful for fast physical prototyping.","parent":"creative"},{"id":"f82","cat":"creative","text":"Physical making and digital making often feed the same design instincts.","parent":"creative"},{"id":"f83","cat":"creative","text":"The recurring pattern is building things, testing them and refining them.","parent":"creative"},{"id":"f84","cat":"creative","text":"Visual construction is approached as a system of parts that need to fit.","parent":"creative"},{"id":"f85","cat":"future","text":"London is a long-term destination for studying music.","parent":"future"},{"id":"f86","cat":"future","text":"Music education and practical creative work are meant to reinforce each other.","parent":"future"},{"id":"f87","cat":"future","text":"Law is also interesting, especially consumer-protection topics.","parent":"future"},{"id":"f88","cat":"future","text":"Learning tends to happen through projects instead of isolated theory.","parent":"future"},{"id":"f89","cat":"future","text":"Software skills are developed by actually building working tools.","parent":"future"},{"id":"f90","cat":"future","text":"Problem solving often means iterating until the result behaves correctly.","parent":"future"},{"id":"f91","cat":"future","text":"Long-term plans combine creative work with technical independence.","parent":"future"},{"id":"f92","cat":"cipher","text":"The Cipher Lab runs encryption locally in the browser.","parent":"cipher"},{"id":"f93","cat":"cipher","text":"AES-256-GCM is used for authenticated encryption.","parent":"cipher"},{"id":"f94","cat":"cipher","text":"PBKDF2-HMAC-SHA-256 is used for passphrase-based key derivation.","parent":"cipher"},{"id":"f95","cat":"cipher","text":"Random salts help derive independent encryption keys.","parent":"cipher"},{"id":"f96","cat":"cipher","text":"Random nonces are generated for encrypted messages.","parent":"cipher"},{"id":"f97","cat":"cipher","text":"Base64 and hexadecimal are useful ciphertext display formats.","parent":"cipher"},{"id":"f98","cat":"cipher","text":"Tamper detection is part of the encryption design.","parent":"cipher"},{"id":"f99","cat":"cipher","text":"Unicode round-trip tests help validate real-world text handling.","parent":"cipher"},{"id":"f100","cat":"cipher","text":"The project is deployed as a static web experience.","parent":"cipher"},{"id":"f101","cat":"cipher","text":"The UI itself is designed as part of the experiment.","parent":"cipher"},{"id":"f102","cat":"cipher","text":"Web building includes debugging deployments, not just writing HTML.","parent":"cipher"},{"id":"f103","cat":"cipher","text":"Search, interaction and visual feedback are treated as first-class features.","parent":"cipher"},{"id":"x0","cat":"music","text":"Writing often develops from a phrase or lyric before the larger production is decided.","parent":"music"},{"id":"x1","cat":"music","text":"Songs are connected to visual storytelling rather than treated as audio-only objects.","parent":"music"},{"id":"x2","cat":"music","text":"The creative workflow moves repeatedly between writing, production, visuals and performance.","parent":"music"},{"id":"x3","cat":"euro","text":"Eurovision staging is studied as a complete production system: light, camera, graphics, props and movement.","parent":"eurovision"},{"id":"x4","cat":"euro","text":"The stage is often imagined from the audience, performer, backstage and production-control viewpoints.","parent":"eurovision"},{"id":"x5","cat":"euro","text":"Postcards can be designed as camera journeys through otherwise hidden parts of a venue.","parent":"eurovision"},{"id":"x6","cat":"euro","text":"A Eurovision concept can start with a physical object and expand into a whole visual world.","parent":"eurovision"},{"id":"x7","cat":"blender","text":"Lighting tests often compare emission, transparency, volumetrics and beam visibility.","parent":"blender"},{"id":"x8","cat":"blender","text":"Procedural systems are preferred when repeating hundreds of pieces would be slow to build manually.","parent":"blender"},{"id":"x9","cat":"blender","text":"Camera scripting is used to reproduce exact reveals and repeated movement patterns.","parent":"blender"},{"id":"x10","cat":"blender","text":"The same project can combine rigid character animation with procedural environmental animation.","parent":"blender"},{"id":"x11","cat":"blender","text":"Large scenes are broken down mentally into stage, character, lighting, camera and atmosphere systems.","parent":"blender"},{"id":"x12","cat":"stage","text":"The stage experiments include large circular platforms and long catwalk structures.","parent":"stage"},{"id":"x13","cat":"stage","text":"The virtual environment uses giant architectural forms to create scale around performers.","parent":"stage"},{"id":"x14","cat":"stage","text":"LED surfaces are imagined as grids of individually controlled pixels rather than one flat color.","parent":"stage"},{"id":"x15","cat":"stage","text":"Fog is used to make beams, depth and negative space visible to the camera.","parent":"stage"},{"id":"x16","cat":"stage","text":"Camera blocking is planned so performers and props stay readable instead of accidentally obscuring each other.","parent":"stage"},{"id":"x17","cat":"stage","text":"Backstage doors, stairs and greenroom openings can become deliberate cinematic transitions.","parent":"stage"},{"id":"x18","cat":"stage","text":"A stage reveal can begin in an ordinary production space and end inside a huge performance environment.","parent":"stage"},{"id":"x19","cat":"dancer","text":"The simplified dancer rig is intentionally easy to script and repair.","parent":"dancer"},{"id":"x20","cat":"dancer","text":"Control empties make common body adjustments accessible without entering Pose Mode.","parent":"dancer"},{"id":"x21","cat":"dancer","text":"The walking system alternates the leading leg while preserving the requested timeline.","parent":"dancer"},{"id":"x22","cat":"dancer","text":"Stair animation is based on exact tread depth and riser height rather than an approximate staircase.","parent":"dancer"},{"id":"x23","cat":"dancer","text":"Character objects are named so animation scripts can target the correct dancer reliably.","parent":"dancer"},{"id":"x24","cat":"dancer","text":"The rig is designed around a minimal number of useful bones instead of many tiny controls.","parent":"dancer"},{"id":"x25","cat":"vr","text":"A scanned room can become a reference for spatial design inside Blender or VR.","parent":"vr"},{"id":"x26","cat":"vr","text":"Spatial interfaces are interesting because they turn a flat screen problem into a physical navigation problem.","parent":"vr"},{"id":"x27","cat":"creative","text":"Hands-on hobbies provide a different kind of prototyping than software work.","parent":"creative"},{"id":"x28","cat":"creative","text":"Building things physically reinforces the same fit-and-refine mindset used in 3D projects.","parent":"creative"},{"id":"x29","cat":"future","text":"A long-term goal is to combine formal music study with a growing technical production skillset.","parent":"future"},{"id":"x30","cat":"future","text":"Project work is used as a way to test whether a new technical idea is actually useful.","parent":"future"},{"id":"x31","cat":"cipher","text":"The encryption interface emphasizes generating a passphrase, encrypting locally and inspecting the resulting ciphertext.","parent":"cipher"},{"id":"x32","cat":"cipher","text":"Authenticated encryption means the system can detect modified ciphertext instead of silently accepting it.","parent":"cipher"},{"id":"x33","cat":"cipher","text":"The project has been iterated through actual browser deployment failures and fixes.","parent":"cipher"},{"id":"x34","cat":"cipher","text":"The same site has also become a sandbox for interactive visualization experiments.","parent":"cipher"},{"id":"x35","cat":"stage","text":"A 12 m ceiling radius is part of the current large-scale stage experiment.","parent":"stage"},{"id":"x36","cat":"stage","text":"The ceiling experiment starts its controller points around a 6 m circle at z=2.","parent":"stage"},{"id":"x37","cat":"stage","text":"The upper controller points expand to a 12 m circle around z=24.","parent":"stage"},{"id":"x38","cat":"stage","text":"The ceiling is intended to remain a single continuous surface instead of many disconnected panels.","parent":"stage"},{"id":"x39","cat":"stage","text":"The ceiling system is meant to react to music and to conflict between independent controllers.","parent":"stage"},{"id":"x40","cat":"stage","text":"The marionette controllers are imagined with different personalities and competing control over the ceiling.","parent":"stage"},{"id":"x41","cat":"stage","text":"A fishing-rod-style cable can sag at short lengths, curve through an intermediate range and straighten when fully extended.","parent":"stage"},{"id":"x42","cat":"stage","text":"The current animation experiments deliberately use hard frame limits so tests stay manageable.","parent":"stage"},{"id":"x43","cat":"stage","text":"A current audio-reactive experiment is limited to the first 2500 animation frames.","parent":"stage"},{"id":"x44","cat":"stage","text":"Large virtual structures are designed with real dimensions so cameras and characters have believable scale.","parent":"stage"},{"id":"x45","cat":"dancer","text":"LEG_BEND is designed as a single high-level control for a predictable crouch pose.","parent":"dancer"},{"id":"x46","cat":"dancer","text":"The standing state keeps LEG_BEND at zero and the bent state offsets thigh and shin rotations together.","parent":"dancer"},{"id":"x47","cat":"dancer","text":"Rigid parenting is useful for low-poly characters where deforming meshes are intentionally avoided.","parent":"dancer"},{"id":"x48","cat":"dancer","text":"The character workflow favors merging unimportant hand and palm pieces when separate controls add clutter.","parent":"dancer"},{"id":"x49","cat":"blender","text":"Blender scripts are repeatedly rebuilt from known-working versions when a project gets too tangled.","parent":"blender"},{"id":"x50","cat":"blender","text":"Dimensions, coordinates and frame ranges are treated as part of the design specification, not incidental notes.","parent":"blender"},{"id":"x51","cat":"creative","text":"The recurring creative pattern is: prototype quickly, inspect the result, identify the mismatch and revise precisely.","parent":"creative"},{"id":"x52","cat":"web","text":"Web interfaces are being used as visual tools, not just static pages.","parent":"web"},{"id":"x53","cat":"web","text":"Deployment itself is part of the development loop: build, publish, inspect, fix and publish again.","parent":"web"}];

function project(p){
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  let x=p.x*cy-p.z*sy, z=p.x*sy+p.z*cy;
  let y=p.y*cp-z*sp; z=p.y*sp+z*cp;
  const depth=14*zoom;
  const scale=depth/(depth+z+8);
  return {x:innerWidth/2+x*scale*72,y:innerHeight/2-y*scale*72,z,scale};
}

 music:point(-6,4,0),eurovision:point(6,4,-.7),blender:point(-6,-3,.4),tech:point(6,-3,1),creative:point(0,-6,-1),future:point(0,6,-2),cipher:point(7,.4,4.3),
 stage:point(-7,-4.7,1.5),dancer:point(-4.2,-1.6,2.2),vr:point(4.5,-4.2,2.6),crypto:point(5.8,1.8,3.1),web:point(4.7,-.8,2.8),detail:point(1.8,-5,0.8)

facts.forEach((f,i)=>{
  const parent=positions[f.parent]||positions.creative;
  const a=i*2.3999632297+(f.parent.length*.31);
  const b=((i*1.618)%Math.PI)-Math.PI/2;
  const r=2.2+(i%7)*.48;
  const x=parent.x+Math.cos(a)*r;
  const y=parent.y+Math.sin(b)*r*.82;
  const z=parent.z+Math.sin(a)*r;
  f.pos=point(x,y,z);
});

function brainPoints(){
  const pts=[];
  for(let i=0;i<1900;i++){
    const hemi=Math.random()<.5?-1:1;
    let x=hemi*(.25+Math.random()*2.25),y=(Math.random()*2-1)*1.75,z=(Math.random()*2-1)*1.95;
    const fold=Math.sin(y*7+z*3)*.16+Math.sin(z*9-y*3)*.11;
    if(x*x/5.2+y*y/3.1+z*z/3.8<1.02+fold)pts.push(point(x,y,z));
  }
  return pts;
}
const brain=brainPoints();

function setupLegend(){
  const counts={};facts.forEach(f=>counts[f.cat]=(counts[f.cat]||0)+1);
  const el=document.getElementById('legendRows');
  Object.entries(cats).forEach(([k,v])=>{
    const row=document.createElement('div');row.className='legendRow';row.innerHTML='<span class="dot"></span>'+v.label+' <span style="margin-left:auto;color:#687486;font-size:8px">'+(counts[k]||0)+'</span>';row.querySelector('.dot').style.background=v.color;el.appendChild(row);
  });
}
function makeLabels(){
  nodes.forEach(n=>{
    const el=document.createElement('div');el.className='clusterLabel';el.innerHTML='<strong></strong><div class="cat"></div><div class="count"></div>';
    el.querySelector('strong').textContent=n.title;el.querySelector('.cat').textContent=cats[n.cat].label;el.querySelector('.cat').style.color=cats[n.cat].color;
    el.querySelector('.count').textContent=(facts.filter(f=>f.parent===n.id).length)+' SPECIFIC DETAILS';
    el.addEventListener('click',()=>selectNode(n));
    labels.appendChild(el);nodeEls.set(n.id,el);
  });
  facts.forEach(f=>{
    const el=document.createElement('div');el.className='factLabel';el.innerHTML='<div class="factTop"><span class="factDot"></span><span class="factText"></span></div><div class="factMeta"></div>';
    el.querySelector('.factText').textContent=f.text;el.querySelector('.factDot').style.background=cats[f.cat].color;
    el.querySelector('.factMeta').textContent=cats[f.cat].label;
    el.addEventListener('click',()=>selectNode(nodes.find(n=>n.id===f.parent)));
    labels.appendChild(el);factEls.set(f.id,el);
  });
}
function resize(){
  const d=Math.min(devicePixelRatio,2);
  canvas.width=lineCanvas.width=Math.floor(innerWidth*d);canvas.height=lineCanvas.height=Math.floor(innerHeight*d);
  canvas.style.width=lineCanvas.style.width=innerWidth+'px';canvas.style.height=lineCanvas.style.height=innerHeight+'px';
  ctx.setTransform(d,0,0,d,0,0);lctx.setTransform(d,0,0,d,0,0);
}
function draw(){
  ctx.clearRect(0,0,innerWidth,innerHeight);lctx.clearRect(0,0,innerWidth,innerHeight);
  const bp=project(point(0,0,0));
  // luminous brain field
  const g=ctx.createRadialGradient(bp.x,bp.y,0,bp.x,bp.y,240);g.addColorStop(0,'rgba(255,138,43,.13)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(bp.x,bp.y,240,0,Math.PI*2);ctx.fill();
  brain.forEach(p=>{
    const q=project(p); if(q.z>25)return;
    const size=Math.max(.55,1.6*q.scale);
    ctx.fillStyle='rgba(160,173,195,.45)';ctx.fillRect(q.x-size/2,q.y-size/2,size,size);
  });
  // brain seam + subtle hemisphere outlines
  ctx.strokeStyle='rgba(125,135,154,.12)';ctx.lineWidth=1;
  [[-1,1],[1,1]].forEach(()=>{});
  // connections between the brain and cluster cores
  Object.entries(positions).forEach(([id,p])=>{
    if(!nodes.some(n=>n.id===id)&&!facts.some(f=>f.parent===id))return;
    const q=project(p);lctx.beginPath();lctx.moveTo(bp.x,bp.y);lctx.lineTo(q.x,q.y);lctx.strokeStyle='rgba(255,255,255,.065)';lctx.stroke();
  });
  nodes.forEach(n=>{
    const p=project(positions[n.id]);if(p.z>18)return;
    n.links.forEach(id=>{if(n.id>id)return;const target=positions[id];if(!target)return;const q=project(target);lctx.beginPath();lctx.moveTo(p.x,p.y);lctx.lineTo(q.x,q.y);lctx.strokeStyle=cats[n.cat].color+'55';lctx.lineWidth=1;lctx.stroke();});
    lctx.fillStyle=cats[n.cat].color;lctx.beginPath();lctx.arc(p.x,p.y,Math.max(2.5,5*p.scale),0,Math.PI*2);lctx.fill();
  });
}
function updateLabels(){
  const query=searchTerm;
  nodes.forEach(n=>{
    const el=nodeEls.get(n.id),p=project(positions[n.id]);
    const visible=!query||n.title.toLowerCase().includes(query)||cats[n.cat].label.toLowerCase().includes(query)||facts.some(f=>f.parent===n.id&&f.text.toLowerCase().includes(query));
    const ok=visible&&p.z<18;
    el.style.display=ok?'block':'none';if(ok){el.style.left=p.x+'px';el.style.top=(p.y-8)+'px';el.style.opacity=Math.max(.35,Math.min(1,1-p.z/25));}
  });
  facts.forEach(f=>{
    const el=factEls.get(f.id),p=project(f.pos);
    const visible=!query||f.text.toLowerCase().includes(query)||cats[f.cat].label.toLowerCase().includes(query);
    const ok=visible&&p.z<20&&p.x>-220&&p.x<innerWidth+220&&p.y>-100&&p.y<innerHeight+100;
    el.style.display=ok?'block':'none';
    if(ok){const s=Math.max(.72,Math.min(1.25,p.scale));el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.transform='translate(-50%,-50%) scale('+s+')';el.style.opacity=Math.max(.34,Math.min(1,1-p.z/28));}
  });
}
function selectNode(n){
  if(!n)return;
  document.getElementById('infoCat').textContent=cats[n.cat].label;
  document.getElementById('infoCat').style.color=cats[n.cat].color;
  document.getElementById('infoTitle').textContent=n.title;
  const details=facts.filter(f=>f.parent===n.id).slice(0,5).map(f=>f.text).join(' · ');
  document.getElementById('infoText').textContent=details||'A connected project cluster.';
  document.getElementById('links').textContent='CONNECTED TO · '+n.links.map(id=>nodes.find(x=>x.id===id)?.title).filter(Boolean).join(' · ');
  document.getElementById('info').classList.add('show');
}
document.getElementById('search').addEventListener('input',e=>{searchTerm=e.target.value.trim().toLowerCase();updateLabels()});
document.getElementById('reset').onclick=()=>{yaw=.12;pitch=.04;zoom=1;};
document.getElementById('focus').onclick=()=>{yaw=.12;pitch=.04;zoom=.56;};
space.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;space.setPointerCapture?.(e.pointerId)});
space.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.006;pitch=Math.max(-1.15,Math.min(1.15,pitch+dy*.006))});
space.addEventListener('pointerup',()=>drag=false);space.addEventListener('pointercancel',()=>drag=false);
space.addEventListener('wheel',e=>{e.preventDefault();zoom*=Math.exp(e.deltaY*.0012);zoom=Math.max(.28,Math.min(2.4,zoom));},{passive:false});
addEventListener('resize',resize);resize();setupLegend();makeLabels();
function loop(){requestAnimationFrame(loop);draw();updateLabels()}loop();
</script>
</body>
</html>
